<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte du cabinet</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="cabinet.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; }
  body { animation: none; background: var(--bg-alt); }
  .leaflet-container { font-family: var(--font-sans); background: var(--bg-alt); }
  .leaflet-tile-pane { filter: grayscale(.55) sepia(.18) saturate(.85) brightness(1.04) contrast(.94); }
  body.mono .leaflet-tile-pane { filter: grayscale(1) brightness(1.06) contrast(.88); }
  body.origine .leaflet-tile-pane { filter: none; }
  .pin { position: relative; width: 22px; height: 22px; }
  .pin span { position: absolute; inset: 0; border-radius: 50%; background: var(--primary); border: 3px solid var(--on-primary); box-shadow: 0 6px 16px -4px rgba(46,51,49,.5); }
  .pin i { position: absolute; inset: -14px; border-radius: 50%; background: var(--primary); opacity: .22; animation: pulse 3.2s var(--ease) infinite; }
  @keyframes pulse { 0% { transform: scale(.4); opacity: .35; } 100% { transform: scale(1.4); opacity: 0; } }
  .leaflet-popup-content-wrapper { border-radius: 18px; box-shadow: var(--shadow-soft); color: var(--ink); }
  .leaflet-popup-content { margin: 16px 20px; line-height: 1.5; font-size: 14px; }
  .leaflet-popup-content strong { font-family: var(--font-serif); font-weight: 500; font-size: 20px; display: block; margin-bottom: 2px; }
  .leaflet-popup-content a { display: inline-block; margin-top: 8px; font-weight: 500; }
  .leaflet-control-zoom a { color: var(--ink) !important; }
  .leaflet-bar { border: 1px solid var(--line) !important; border-radius: 12px !important; overflow: hidden; }
  .hint { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 500; padding: 8px 16px; border-radius: 999px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); font-size: 13px; color: var(--ink-2); pointer-events: none; transition: opacity 500ms var(--ease); white-space: nowrap; }
</style>
</head>
<body>
<div id="map" role="region" aria-label="Carte interactive de l'emplacement du cabinet"></div>
<div class="hint" id="hint">Cliquez sur la carte pour zoomer</div>
<script>
  var st = new URLSearchParams(location.search).get('style'); if (st) document.body.classList.add(st);
  try { var t = JSON.parse(localStorage.getItem('cabinet-theme') || 'null'); if (t && t.palette) document.documentElement.setAttribute('data-palette', t.palette); } catch (e) {}
  (function (c) {
    var p = c.coordonnees;
    var map = L.map('map', { scrollWheelZoom: false, zoomControl: false }).setView([p.lat, p.lng], p.zoom || 16);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
    var icon = L.divIcon({ className: '', html: '<div class="pin"><i></i><span></span></div>', iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -14] });
    var dest = encodeURIComponent(c.adresse + ', ' + c.codePostal + ' ' + c.ville);
    L.marker([p.lat, p.lng], { icon: icon, title: 'Cabinet ' + c.nom }).addTo(map)
      .bindPopup('<strong>' + c.nom + '</strong>' + c.adresse + '<br>' + c.codePostal + ' ' + c.ville +
        '<br><a href="https://www.google.com/maps/dir/?api=1&destination=' + dest + '" target="_blank" rel="noopener">Itinéraire ↗</a>')
      .openPopup();
    map.once('click', function () { map.scrollWheelZoom.enable(); document.getElementById('hint').style.opacity = 0; });
  })(window.CABINET);
</script>
</body>
</html>
